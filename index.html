<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HisabCraft — Free GST Billing, Khata & Inventory</title>
<meta name="description" content="Free, offline, open-source GST billing + khata + inventory for Bharat shops. Tally/Vyapar alternative. Your data stays on your device.">
<meta property="og:title" content="HisabCraft — Free GST Billing, Khata & Inventory">
<meta property="og:description" content="Free, offline, open-source GST billing + khata + inventory for Bharat shops. Your data stays on your device.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://sugamdeol.github.io/hisabcraft/screenshots/dashboard.png">
<meta property="og:url" content="https://sugamdeol.github.io/hisabcraft/">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#241d15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/mukta.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="icons/icon.svg" alt="HisabCraft logo" class="brand-icon">
      <div>
        <div class="brand-name">HisabCraft</div>
        <div class="brand-sub" data-i18n="tagline">Free GST billing for Bharat</div>
      </div>
    </div>
    <nav id="nav">
      <a href="#dashboard" data-view="dashboard">
        <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
        <span data-i18n="nav_dashboard">Dashboard</span>
      </a>
      <a href="#sales" data-view="sales">
        <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3h11v17.5l-2.2-1.6-2.2 1.6-2.15-1.6-2.15 1.6-2.3-1.6V3z"/><path d="M9.5 8h5M9.5 11.5h5"/></svg>
        <span data-i18n="nav_sales">Sales Invoices</span>
      </a>
      <a href="#purchases" data-view="purchases">
        <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/></svg>
        <span data-i18n="nav_purchases">Purchases</span>
      </a>
      <a href="#parties" data-view="parties">
        <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.2 2.5-5.2 5.5-5.2s5.5 2 5.5 5.2"/><circle cx="17" cy="9" r="2.6"/><path d="M15.6 14.7c2.7.4 4.9 2.2 4.9 4.8"/></svg>
        <span data-i18n="nav_parties">Parties (Khata)</span>
      </a>
      <a href="#items" data-view="items">
        <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.6 3H21v8.4L11.4 21 3 12.6V3h9.6z"/><circle cx="17" cy="7" r="1.6"/></svg>
        <span data-i18n="nav_items">Items & Stock</span>
      </a>
      <a href="#payments" data-view="payments">
        <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6.5" width="18" height="11" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6.6 9.6h0M17.4 14.4h0"/></svg>
        <span data-i18n="nav_payments">Payments</span>
      </a>
      <a href="#reports" data-view="reports">
        <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V13M12 20V6M19 20V9.5"/><path d="M3.5 20h17"/></svg>
        <span data-i18n="nav_reports">Reports (GST)</span>
      </a>
      <a href="#settings" data-view="settings">
        <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
        <span data-i18n="nav_settings">Settings</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="offline-badge" data-i18n="offline_badge">Works offline</div>
      <button class="btn secondary small" id="langBtn">हिन्दी</button>
      <div class="foot-note">v1.0 · MIT · <a href="https://github.com/Sugamdeol/hisabcraft" target="_blank" rel="noopener">GitHub</a></div>
    </div>
  </aside>
  <button class="menu-btn" id="menuBtn">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    Menu
  </button>
  <main class="main" id="main"></main>
</div>
<div id="print-area"></div>
<div id="toast" class="toast hidden"></div>
<script src="js/gst.js"></script>
<script src="js/db.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
